name: Build UnityOrbisBridge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prx:
    runs-on: ubuntu-22.04
    env:
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis/PS4Toolchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake curl make pkg-config unzip xz-utils

      - name: Install LLVM 12.0.0
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: "12.0.0"

      - name: Restore pinned OpenOrbis toolchain and libraries
        id: cache-toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: OpenOrbis/PS4Toolchain
          key: openorbis-v0.5.3-75d1267-oosdk-5b86e2d-libjbc-835fe01-sdl-c3b571b-r2

      - name: Checkout oosdk_libraries
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bucanero/oosdk_libraries
          path: oosdk_libraries
          ref: 5b86e2d25e674f64b8dce9aee319a9f8aa6a09ea

      - name: Checkout libjbc
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bucanero/ps4-libjbc
          path: ps4-libjbc
          ref: 835fe016ff0ae5dd89b9249f39cc0fe093fd07dd

      - name: Install pinned OpenOrbis toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output toolchain-llvm-12.zip \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/toolchain-llvm-12.zip
          echo "75d1267d1ec29300e9b578d620d7a55fe678a8c0faeaeeb416a67e6d692352d2  toolchain-llvm-12.zip" | sha256sum --check --strict
          unzip -q toolchain-llvm-12.zip
          tar -xzf toolchain-llvm-12.tar.gz
          rm -f toolchain-llvm-12.zip toolchain-llvm-12.tar.gz
          cp .github/workflows/build_rules.mk "${OO_PS4_TOOLCHAIN}/"

      - name: Install pinned OpenOrbis libraries
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          make -C oosdk_libraries/zlib_partial install
          make -C oosdk_libraries/polarssl-1.3.9 install
          mkdir -p oosdk_libraries/curl-7.64.1/orbis
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output oosdk_libraries/curl-7.64.1/orbis/openorbis.cmake \
            https://raw.githubusercontent.com/bucanero/SDL-PS4/c3b571b78a7d97d70c621d149b464ad80310788a/cmake/openorbis.cmake
          cmake -S oosdk_libraries/curl-7.64.1 -B oosdk_libraries/curl-7.64.1/orbis \
            --toolchain "${GITHUB_WORKSPACE}/oosdk_libraries/curl-7.64.1/orbis/openorbis.cmake" \
            -DCMAKE_USE_POLARSSL=1 -DUSE_UNIX_SOCKETS=0 -DENABLE_THREADED_RESOLVER=0 -DENABLE_IPV6=0
          cmake --build oosdk_libraries/curl-7.64.1/orbis --target libcurl
          cp oosdk_libraries/curl-7.64.1/orbis/lib/libcurl.a "${OO_PS4_TOOLCHAIN}/lib/"
          cp -R oosdk_libraries/curl-7.64.1/include/curl "${OO_PS4_TOOLCHAIN}/include/"
          make -C ps4-libjbc install

      - name: Build PRX
        run: make -C source/plugin

      - name: Hash PRX
        run: sha256sum source/plugin/UnityOrbisBridge.prx

      - name: Upload PRX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UnityOrbisBridge-PRX
          path: source/plugin/UnityOrbisBridge.prx
          if-no-files-found: error
          retention-days: 14

  build-dll:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      - name: Build managed API
        run: >
          msbuild.exe source/Unity-API/UnityOrbisBridge.sln
          /nologo
          /nr:false
          /m
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /p:TargetFrameworkVersion=v3.5

      - name: Hash managed API
        shell: pwsh
        run: Get-FileHash -Algorithm SHA256 source/Unity-API/bin/Release/UnityOrbisBridge.dll

      - name: Upload managed API
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UnityOrbisBridge-DLL
          path: source/Unity-API/bin/Release/UnityOrbisBridge.dll
          if-no-files-found: error
          retention-days: 14

  combine:
    needs: [build-prx, build-dll]
    runs-on: ubuntu-22.04

    steps:
      - name: Download PRX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: UnityOrbisBridge-PRX
          path: UnityOrbisBridge

      - name: Download managed API
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: UnityOrbisBridge-DLL
          path: UnityOrbisBridge

      - name: Create provenance hashes
        run: |
          cd UnityOrbisBridge
          sha256sum --binary UnityOrbisBridge.prx UnityOrbisBridge.dll > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload combined artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UnityOrbisBridge
          path: UnityOrbisBridge
          if-no-files-found: error
          retention-days: 14
